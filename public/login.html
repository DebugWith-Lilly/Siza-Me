<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SizaMe - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f6efe6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .phone {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
            background: #f6efe6;
        }

        .screen {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .text-content {
            margin-bottom: 35px;
        }

        .text-content h1 {
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            font-weight: 700;
            color: #2b422a;
            letter-spacing: -0.8px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .text-content p {
            font-size: 0.95rem;
            font-weight: 600;
            color: #262626;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #2b422a;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1.5px solid #d4c5b9;
            background: #fffaf5;
            font-family: inherit;
            font-size: 0.95rem;
            color: #262626;
            outline: none;
        }

        .input-group input::placeholder {
            color: #9c8e83;
        }

        .input-group input:focus {
            border-color: #364935;
            box-shadow: 0 0 0 3px rgba(54, 73, 53, 0.15);
        }

        .password-wrapper,
        .email-mask-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border: none;
            background: transparent;
            color: #364935;
            cursor: pointer;
        }

        .password-toggle:focus-visible {
            outline: 2px solid #364935;
            outline-offset: 3px;
        }

        .forgot-password {
            align-self: flex-end;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6b5a4e;
            text-decoration: none;
            margin-top: -4px;
            margin-bottom: 5px;
        }

        .forgot-password:hover {
            color: #2b422a;
            text-decoration: underline;
        }

        .primary-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            background: #364935;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-decoration: none;
            transition: background 0.25s, transform 0.15s;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 14px rgba(54, 73, 53, 0.25);
            margin-top: 10px;
        }

        .primary-btn:hover {
            background: #293828;
            transform: translateY(-2px);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .primary-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            overflow-wrap: anywhere;
        }

        .message:not(:empty) {
            display: block;
        }

        .email-mask-display {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 14px 18px;
            border: 1.5px solid #d4c5b9;
            border-radius: 14px;
            background: #fffaf5;
            font-family: inherit;
            font-size: 0.95rem;
            color: #262626;
            pointer-events: none;
        }

        .email-mask-display[hidden] {
            display: none;
        }

        .email-mask-wrapper input.masked-email {
            color: transparent;
            caret-color: transparent;
        }

        .top-left-decor,
        .bottom-left-decor,
        .bottom-right-decor {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .top-left-decor {
            top: 0;
            left: 0;
            width: 155px;
            height: 165px;
        }

        .bottom-left-decor {
            bottom: 0;
            left: 0;
            width: 175px;
            height: 250px;
        }

        .bottom-right-decor {
            bottom: 0;
            right: 0;
            width: 180px;
            height: 200px;
        }

        @media (max-width: 480px) {
            .phone {
                padding: 35px 12px;
            }

            .screen {
                padding: 0 12px;
            }

            .top-left-decor {
                width: 110px;
                height: 120px;
            }

            .bottom-left-decor {
                width: 120px;
                height: 175px;
            }

            .bottom-right-decor {
                width: 125px;
                height: 140px;
            }
        }
    </style>
</head>

            <path d="M0 50 C20 50 40 70
