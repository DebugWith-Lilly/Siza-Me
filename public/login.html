
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siza-Me | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f6efe6;
            color: #262626;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 18px;
            position: relative;
            overflow: hidden;
        }

        .decoration {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #c26638;
            opacity: 0.9;
            pointer-events: none;
        }

        .decoration.top {
            top: -65px;
            left: -45px;
            border-radius: 0 0 100% 0;
        }

        .decoration.bottom {
            bottom: -75px;
            right: -45px;
            border-radius: 100% 0 0 0;
            background: #364935;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 1;
            background: #fffaf5;
            border: 1px solid #eadbce;
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 15px 45px rgba(54, 73, 53, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            color: #2b422a;
            font-size: clamp(2rem, 6vw, 2.7rem);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .brand p {
            font-size: 0.9rem;
            color: #6b5a4e;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            color: #2b422a;
            font-size: 0.88rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #d4c5b9;
            border-radius: 12px;
            background: #fff;
            font: inherit;
            font-size: 0.92rem;
            outline: none;
        }

        input:focus {
            border-color: #364935;
            box-shadow: 0 0 0 3px rgba(54, 73, 53, 0.12);
        }

        /* Added by: Thumbi - visually mask the email when focus leaves the field. */
        .email-mask-wrapper {
            position: relative;
            width: 100%;
        }

        .email-mask-wrapper input.masked-email {
            color: transparent;
            caret-color: transparent;
        }

        .email-mask-display {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            padding: 13px 15px;
            border: 1.5px solid transparent;
            pointer-events: none;
            font: inherit;
            font-size: 0.92rem;
            color: #262626;
            overflow: hidden;
            white-space: nowrap;
        }

        .email-mask-display[hidden] {
            display: none;
        }

        .password-wrapper {
            display: flex;
            gap: 8px;
        }

        .password-wrapper input {
            flex: 1;
            min-width: 0;
        }

        .toggle-button {
            padding: 0 12px;
            border: 1px solid #d4c5b9;
            border-radius: 12px;
            background: #f6efe6;
            color: #364935;
            cursor: pointer;
            font-family: inherit;
        }

        .phone-note {
            color: #75675c;
            font-size: 0.76rem;
            line-height: 1.5;
        }

        .forgot-password {
            align-self: flex-end;
            color: #6b5a4e;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 50px;
            background: #364935;
            color: #fff;
            padding: 14px 20px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .primary-btn:hover {
            background: #293828;
        }

        .primary-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.83rem;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .message:not(:empty) {
            display: block;
            background: #f2e7dc;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 27px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="decoration top" aria-hidden="true"></div>
        <div class="decoration bottom" aria-hidden="true"></div>

        <section class="login-card">
            <header class="brand">
                <h1>Welcome Back</h1>
                <p>My community. My Safety. My Voice.</p>
            </header>

            <form class="login-form" id="login-form">
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="toggle-button"
                            id="togglePassword"
                            aria-label="Show password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone-number">Phone number (optional)</label>
                    <input
                        type="tel"
                        id="phone-number"
                        name="phoneNumber"
                        placeholder="+27 82 123 4567"
                        autocomplete="tel"
                        maxlength="20"
                        inputmode="tel">

                    <p class="phone-note">
                        Add your number so it can be associated with your existing Siza-Me account.
                        No SMS or phone verification is required.
                    </p>
                </div>

                <a href="#" class="forgot-password">Forgot Password?</a>

                <p
                    id="login-message"
                    class="message"
                    role="status"
                    aria-live="polite"></p>

                <button type="submit" class="primary-btn" id="login-button">
                    Log In
                </button>
            </form>
        </section>
    </main>

    <!-- Added by: Thumbi - visually mask the email without changing its value. -->
    <script>
        const emailInput = document.getElementById("email");
        const emailWrapper = document.createElement("div");

        emailWrapper.className = "email-mask-wrapper";
        emailInput.parentNode.insertBefore(emailWrapper, emailInput);
        emailWrapper.appendChild(emailInput);

        const maskedDisplay = document.createElement("div");

        maskedDisplay.className = "email-mask-display";
        maskedDisplay.hidden = true;
        maskedDisplay.setAttribute("aria-hidden", "true");
        emailWrapper.appendChild(maskedDisplay);

        function maskEmail(email) {
            const atIndex = email.lastIndexOf("@");

            if (atIndex <= 0) {
                return email;
            }

            return email.substring(0, Math.min(3, atIndex))
                + "***"
                + email.substring(atIndex);
        }

        emailInput.addEventListener("blur", function () {
            const email = emailInput.value.trim();

            if (email && email.includes("@")) {
                maskedDisplay.textContent = maskEmail(email);
                maskedDisplay.hidden = false;
                emailInput.classList.add("masked-email");
            }
        });

        emailInput.addEventListener("focus", function () {
            maskedDisplay.hidden = true;
            emailInput.classList.remove("masked-email");
        });
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
