<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SizaMe - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f6efe6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .phone {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
            background: #f6efe6;
        }

        .screen {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .text-content {
            margin-bottom: 35px;
        }

        .text-content h1 {
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            font-weight: 700;
            color: #2b422a;
            letter-spacing: -0.8px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .text-content p {
            font-size: 0.95rem;
            font-weight: 600;
            color: #262626;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #2b422a;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1.5px solid #d4c5b9;
            background: #fffaf5;
            font-family: inherit;
            font-size: 0.95rem;
            color: #262626;
            outline: none;
        }

        .input-group input::placeholder {
            color: #9c8e83;
        }

        .input-group input:focus {
            border-color: #364935;
            box-shadow: 0 0 0 3px rgba(54, 73, 53, 0.15);
        }

        .password-wrapper,
        .email-mask-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border: none;
            background: transparent;
            color: #364935;
            cursor: pointer;
        }

        .password-toggle:focus-visible {
            outline: 2px solid #364935;
            outline-offset: 3px;
        }

        .forgot-password {
            align-self: flex-end;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6b5a4e;
            text-decoration: none;
            margin-top: -4px;
            margin-bottom: 5px;
        }

        .forgot-password:hover {
            color: #2b422a;
            text-decoration: underline;
        }

        .primary-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            background: #364935;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-decoration: none;
            transition: background 0.25s, transform 0.15s;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 14px rgba(54, 73, 53, 0.25);
            margin-top: 10px;
        }

        .primary-btn:hover {
            background: #293828;
            transform: translateY(-2px);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .primary-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            overflow-wrap: anywhere;
        }

        .message:not(:empty) {
            display: block;
        }

        .email-mask-display {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 14px 18px;
            border: 1.5px solid #d4c5b9;
            border-radius: 14px;
            background: #fffaf5;
            font-family: inherit;
            font-size: 0.95rem;
            color: #262626;
            pointer-events: none;
        }

        .email-mask-display[hidden] {
            display: none;
        }

        .email-mask-wrapper input.masked-email {
            color: transparent;
            caret-color: transparent;
        }

        .top-left-decor,
        .bottom-left-decor,
        .bottom-right-decor {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .top-left-decor {
            top: 0;
            left: 0;
            width: 155px;
            height: 165px;
        }

        .bottom-left-decor {
            bottom: 0;
            left: 0;
            width: 175px;
            height: 250px;
        }

        .bottom-right-decor {
            bottom: 0;
            right: 0;
            width: 180px;
            height: 200px;
        }

        /* Phone verification popup */

        .phone-modal[hidden] {
            display: none;
        }

        .phone-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .phone-modal-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 18px;
            background: #fffaf5;
            color: #262626;
        }

        .phone-modal-card h2 {
            margin: 10px 0;
            color: #2b422a;
        }

        .phone-modal-card label {
            display: block;
            margin: 15px 0 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .phone-modal-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4c5b9;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .modal-eyebrow {
            color: #c26638;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .modal-description {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            border: none;
            background: none;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .modal-cancel {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #d4c5b9;
            border-radius: 50px;
            background: transparent;
            font-family: inherit;
            cursor: pointer;
        }

        #phone-modal-message {
            margin-top: 12px;
            font-size: 0.85rem;
            overflow-wrap: anywhere;
        }

        #recaptcha-container {
            margin-top: 12px;
            overflow-x: auto;
        }

        @media (max-width: 480px) {
            .phone {
                padding: 35px 12px;
            }

            .screen {
                padding: 0 12px;
            }

            .top-left-decor {
                width: 110px;
                height: 120px;
            }

            .bottom-left-decor {
                width: 120px;
                height: 175px;
            }

            .bottom-right-decor {
                width: 125px;
                height: 140px;
            }
        }
    </style>
</head>

<body>
<div class="phone">

    <!-- Top-left decoration -->
    <div class="top-left-decor" aria-hidden="true">
        <svg width="100%" height="100%" viewBox="0 0 155 165" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0 H120 C120 0 100 45 60 55 C20 65 0 120 0 120 V0 Z" fill="#C26638"/>
            <path d="M0 50 C20 50 40 70 30 110 C20 150 0 165 0 165 V50 Z" fill="#E8B87D" opacity=".85"/>
            <path d="M15 10 L35 40 M30 10 L50 35 M45 10 L65 30 M10 25 L25 50" stroke="#EFE1CE" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Login screen -->
    <main class="screen">
        <div class="text-content">
            <h1>Welcome Back</h1>
            <p>My community. My Safety. My Voice.</p>
        </div>

        <form class="login-form" id="login-form">

            <div class="input-group">
                <label for="email">Username / Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false">

                        <svg id="eyeIcon"
                             xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <a href="#" class="forgot-password">Forgot Password?</a>

            <p id="login-message" class="message" role="status" aria-live="polite"></p>

            <button type="submit" class="primary-btn" id="login-button">
                Log In
            </button>

        </form>
    </main>

    <!-- Phone verification popup -->
    <div id="phone-modal" class="phone-modal" hidden>
        <div class="phone-modal-card"
             role="dialog"
             aria-modal="true"
             aria-labelledby="phone-modal-title">

            <button type="button"
                    id="close-phone-modal"
                    class="modal-close"
                    aria-label="Close">×</button>

            <p class="modal-eyebrow">SIZA-ME SECURITY</p>

            <h2 id="phone-modal-title">Secure Your Account</h2>

            <p class="modal-description">
                Add your phone number to protect your account with
                two-step verification.
            </p>

            <label for="mfa-phone">Phone number</label>

            <input
                type="tel"
                id="mfa-phone"
                placeholder="+27 82 123 4567"
                autocomplete="tel">

            <div id="recaptcha-container"></div>

            <p id="phone-modal-message" role="status" aria-live="polite"></p>

            <button type="button" id="send-phone-code" class="primary-btn">
                Send Verification Code
            </button>

            <button type="button" id="cancel-phone-modal" class="modal-cancel">
                Cancel
            </button>
        </div>
    </div>

    <!-- Bottom-left Protea decoration -->
    <div class="bottom-left-decor" aria-hidden="true">
        <svg width="100%" height="100%" viewBox="0 0 175 250" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M-10 120 C30 110 70 150 50 210 C10 210 -10 170 -10 120 Z" fill="#2E402D"/>
            <path d="M30 180 C80 160 110 200 80 250 C40 250 20 220 30 180 Z" fill="#4B5C40"/>
            <path d="M-20 200 C30 190 80 220 70 270 H-20 V200 Z" fill="#E8B87D" opacity=".8"/>
            <g transform="translate(10, 140)">
                <path d="M35 50 C15 30 10 0 35 -10 C45 10 45 30 35 50 Z" fill="#C26638"/>
                <path d="M35 50 C25 25 30 -5 48 -15 C55 10 50 30 35 50 Z" fill="#D87846"/>
                <path d="M35 50 C35 20 50 -10 65 -12 C68 15 58 35 35 50 Z" fill="#C26638"/>
                <path d="M35 50 C45 25 65 0 80 5 C78 25 60 40 35 50 Z" fill="#D6A35C"/>
                <path d="M35 50 C5 35 -5 10 15 0 C25 20 30 38 35 50 Z" fill="#B85834"/>
                <path d="M35 50 L10 110" stroke="#2E402D" stroke-width="7" stroke-linecap="round"/>
            </g>
        </svg>
    </div>

    <!-- Bottom-right geometric decoration -->
    <div class="bottom-right-decor" aria-hidden="true">
        <svg width="100%" height="100%" viewBox="0 0 180 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M180 40 C110 40 40 100 20 200 H180 V40 Z" fill="#C26638"/>
            <g opacity=".9">
                <path d="M180 80 L120 140 L180 200" stroke="#F6EFE6" stroke-width="12" stroke-linecap="square" fill="none"/>
                <path d="M180 105 L140 145 L180 185" stroke="#364935" stroke-width="10" stroke-linecap="square" fill="none"/>
                <path d="M180 125 L155 150 L180 175" stroke="#D6A35C" stroke-width="8" stroke-linecap="square" fill="none"/>
                <line x1="80" y1="200" x2="180" y2="100" stroke="#364935" stroke-width="6"/>
                <line x1="110" y1="200" x2="180" y2="130" stroke="#F6EFE6" stroke-width="6"/>
                <line x1="140" y1="200" x2="180" y2="160" stroke="#D6A35C" stroke-width="6"/>
            </g>
        </svg>
    </div>

</div>

<!-- Existing Firebase authentication script -->
<script type="module" src="script.js"></script>

<script>
    // Show/hide password.

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
        const show = passwordInput.type === "password";

        passwordInput.type = show ? "text" : "password";

        togglePassword.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password"
        );

        togglePassword.setAttribute("aria-pressed", String(show));

        eyeIcon.innerHTML = show
            ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a13 13 0 0 1-3 3.8"/><path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>'
            : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    });

    // Visually mask the email when focus leaves the field.
    // The actual input value is unchanged for Firebase authentication.

    const emailInput = document.getElementById("email");
    const emailWrapper = document.createElement("div");

    emailWrapper.className = "email-mask-wrapper";
    emailInput.parentNode.insertBefore(emailWrapper, emailInput);
    emailWrapper.appendChild(emailInput);

    const maskedDisplay = document.createElement("div");

    maskedDisplay.className = "email-mask-display";
    maskedDisplay.hidden = true;
    maskedDisplay.setAttribute("aria-hidden", "true");
    emailWrapper.appendChild(maskedDisplay);

    function maskEmail(email) {
        const atIndex = email.lastIndexOf("@");

        if (atIndex <= 0) {
            return email;
        }

        return email.substring(0, Math.min(3, atIndex))
            + "***"
            + email.substring(atIndex);
    }

    emailInput.addEventListener("blur", function () {
        const email = emailInput.value.trim();

        if (email && email.includes("@")) {
            maskedDisplay.textContent = maskEmail(email);
            maskedDisplay.hidden = false;
            emailInput.classList.add("masked-email");
        }
    });

    emailInput.addEventListener("focus", function () {
        maskedDisplay.hidden = true;
        emailInput.classList.remove("masked-email");
    });

    // Phone popup controls.
    // Firebase SMS verification must be implemented in script.js separately.

    const phoneModal = document.getElementById("phone-modal");
    const closePhoneModal = document.getElementById("close-phone-modal");
    const cancelPhoneModal = document.getElementById("cancel-phone-modal");

    function closeModal() {
        phoneModal.hidden = true;
    }

    closePhoneModal.addEventListener("click", closeModal);
    cancelPhoneModal.addEventListener("click", closeModal);

    phoneModal.addEventListener("click", function (event) {
        if (event.target === phoneModal) {
            closeModal();
        }
    });
</script>

</body>
</html>
