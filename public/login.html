<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Universal character set encoding -->
    <meta charset="UTF-8">

    <!-- Responsive viewport configuration for mobile and laptop screen alignment -->

    <!-- Browser tab title -->
    <title>SizaMe - Login</title>

    <!-- Google Font import: Poppins for clean modern typography -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* ==========================================================================
           GLOBAL RESET & BASE LAYOUT STYLES
           ========================================================================== */

        /* Universal box-sizing reset to ensure padding doesn't affect dimensions */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Outer body container setting full page background and layout */
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f6efe6; /* Exact warm cream background color applied to the entire page */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================================================
           MAIN RESPONSIVE SCREEN CONTAINER STYLES (NO PHONE OUTLINE)
           ========================================================================== */

        /* Main responsive screen display container filling the viewport */
        .phone {
            position: relative;
            width: 100%;
            min-height: 100vh; /* Full viewport height for laptop and mobile responsiveness */
            background-color: #f6efe6; /* Exact warm cream background color from design theme */
            overflow: hidden;   /* Keeps top and bottom artwork clipped cleanly inside viewport edges */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centered content vertically */
            align-items: center;
            padding: 40px 20px; /* Responsive padding */
        }

        /* ==========================================================================
           SCREEN CONTENT & TYPOGRAPHY STYLES
           ========================================================================== */

        /* Screen content wrapper container */
        .screen {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 420px; /* Limits max width on large laptop screens for optimal form readability */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Heading container styling */
        .text-content {
            margin-bottom: 35px;
        }

        /* Main heading "Welcome Back" */
        .text-content h1 {
            font-size: clamp(2.5rem, 4.5vw, 3.2rem); /* Responsive font scaling for mobile and laptops */
            font-weight: 700;
            color: #2b422a; /* Exact deep forest green tone matching theme branding */
            letter-spacing: -0.8px;
            line-height: 1.1;
            margin-bottom: 8px;
            white-space: nowrap; /* Forces Welcome Back onto a single line */
        }

        /* Subtitle tagline styling */
        .text-content p {
            font-size: clamp(0.9rem, 1.8vw, 1rem);
            font-weight: 600;
            color: #262626;
            letter-spacing: -0.1px;
        }

        /* ==========================================================================
           LOGIN FORM STYLES
           ========================================================================== */

        /* Form layout container */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        /* Input field group container */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Input field label styling */
        .input-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #2b422a;
            padding-left: 4px;
        }

        /* Text and password input textboxes */
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1.5px solid #d4c5b9;
            background-color: #fffaf5;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            color: #262626;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
        }

        /* Input field placeholder styling */
        .input-group input::placeholder {
            color: #9c8e83;
            font-size: 0.9rem;
        }

        /* Input field focus state for accessibility and user feedback */
        .input-group input:focus {
            border-color: #364935;
            box-shadow: 0 0 0 3px rgba(54, 73, 53, 0.15);
        }

        /* Forgot password link styling */
        .forgot-password {
            align-self: flex-end;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6b5a4e;
            text-decoration: none;
            transition: color 0.2s ease;
            margin-top: -4px;
            margin-bottom: 5px;
        }

        /* Forgot password hover state */
        .forgot-password:hover {
            color: #2b422a;
            text-decoration: underline;
        }

        /* ==========================================================================
           PRIMARY BUTTON STYLES (LOGIN BUTTON)
           ========================================================================== */

        /* Primary "Log In" Button styling */
        .primary-btn {
            /* Flexbox alignment for button text */
            display: flex;
            align-items: center;
            justify-content: center;

            /* Width and internal button padding */
            width: 100%;
            padding: 14px 24px;

            /* Fully rounded pill capsule shape matching theme */
            border-radius: 50px;

            /* Exact dark olive green background color matching theme branding */
            background-color: #364935;
            color: #ffffff; /* Clean white text color */

            /* Button text typography settings */
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-decoration: none;

            /* Interactive animations and state transitions */
            transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            cursor: pointer;
            border: none;
            outline: none;

            /* Soft grounding shadow under button */
            box-shadow: 0 4px 14px rgba(54, 73, 53, 0.25);
            margin-top: 10px;
        }

        /* Hover State for Log In Button */
        .primary-btn:hover {
            background-color: #293828; /* Deepens green shade slightly on hover */
            transform: translateY(-2px); /* Subtle upward lift effect */
            box-shadow: 0 6px 18px rgba(54, 73, 53, 0.35); /* Enhances shadow depth */
        }

        /* Active Press State for Log In Button */
        .primary-btn:active {
            transform: translateY(0); /* Returns button position down on click press */
            box-shadow: 0 2px 8px rgba(54, 73, 53, 0.2);
        }

        /* Focus state for keyboard accessibility */
        .primary-btn:focus-visible {
            outline: 2px solid #364935;
            outline-offset: 3px;
        }

        /* ==========================================================================
           BACKGROUND ARTWORK & TRADITIONAL PATTERN SVG OVERLAYS

        .top-left-decor {

            position: absolute;
            bottom: 0;
            right: 0;
            width: 180px;
            height: 200px;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<script>
    // Added by: Thumbi
    // Purpose: Toggle password visibility without changing its value.

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    if (passwordInput && togglePassword && eyeIcon) {
        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";

            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            togglePassword.setAttribute(
                "aria-pressed",
                String(isHidden)
            );

            eyeIcon.innerHTML = isHidden
                ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a13 13 0 0 1-3 3.8"/><path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>'
                : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
        });
    }
</script>

<!-- Added by: Thumbi
     Purpose: Display a partially masked email address for privacy.
     The original email value remains unchanged for authentication. -->

<style>
    .email-mask-display {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 14px 18px;
        border: 1.5px solid #d4c5b9;
        border-radius: 14px;
        background-color: #fffaf5;
        font-family: 'Poppins', sans-serif;
        font-size: 0.95rem;
        color: #262626;
        pointer-events: none;
        box-sizing: border-box;
    }

    .email-mask-wrapper {
        position: relative;
        width: 100%;
    }
</style>


<script>
    // Added by: Thumbi
    // Purpose: Mask the email visually when the field loses focus.

    document.addEventListener("DOMContentLoaded", function () {
        const emailInput = document.getElementById("email");

        if (!emailInput) return;

        const wrapper = document.createElement("div");
        wrapper.className = "email-mask-wrapper";

        emailInput.parentNode.insertBefore(wrapper, emailInput);
        wrapper.appendChild(emailInput);

        const maskedDisplay = document.createElement("div");
        maskedDisplay.className = "email-mask-display";
        maskedDisplay.hidden = true;
        maskedDisplay.setAttribute("aria-hidden", "true");
        wrapper.appendChild(maskedDisplay);

        // Added by: Thumbi
        // Purpose: Hide part of the email username for privacy.
        function maskEmail(email) {
            const atIndex = email.lastIndexOf("@");

            if (atIndex <= 0) return email;

            const username = email.substring(0, atIndex);
            const domain = email.substring(atIndex);

            return username.substring(0, Math.min(3, username.length))
                + "***" + domain;
        }

        // Added by: Thumbi
        // Purpose: Display the masked email when the field loses focus.
        emailInput.addEventListener("blur", function () {
            const email = emailInput.value.trim();

            if (email && email.includes("@")) {
                maskedDisplay.textContent = maskEmail(email);
                emailInput.style.color = "transparent";
                maskedDisplay.hidden = false;
            } else {
                maskedDisplay.hidden = true;
                emailInput.style.color = "";
            }
        });

        // Added by: Thumbi
        // Purpose: Restore the full email when the user clicks back into the field.
        emailInput.addEventListener("focus", function () {
            emailInput.style.color = "";
            maskedDisplay.hidden = true;
        });
    });
</script>
