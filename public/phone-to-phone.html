<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Siza-Me | Phone-to-Phone Tracking</title>
    <meta name="description"
          content="Siza-Me Safe Circle location sharing.">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        #live-map {
            width: 100%;
            height: 400px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<main id="phone-to-phone-page">

    <header>
        <h1>Siza-Me Tracker</h1>
        <p>My community. My Safety. My Voice.</p>
        <p>Stay connected with your Safe Circle.</p>
    </header>

    <section>
        <h2>Your Safe Circle</h2>

        <label for="person-select">Select a person:</label>

        <select id="person-select" required>
            <option value="">Choose a member</option>
            <option value="ntombi">Ntombi</option>
            <option value="member-2">Safe Circle Member 2</option>
            <option value="member-3">Safe Circle Member 3</option>
        </select>

        <p id="selected-person-message" aria-live="polite">
            Select a member to continue.
        </p>

        <label for="tracking-date">Tracking date:</label>
        <input type="date" id="tracking-date" required>

        <button type="button" id="request-location-button">
            Request Location
        </button>

        <p id="request-status" role="status" aria-live="polite"></p>
    </section>

    <section id="location-section" hidden>
        <h2>Location Tracking</h2>

        <h3 id="location-heading"></h3>

        <p id="location-status" role="status" aria-live="polite">
            Location obtained.
        </p>

        <div
            id="live-map"
            role="application"
            aria-label="Location map">
        </div>

        <p id="coordinates"></p>

        <button type="button" id="open-google-maps-button">
            Open Google Maps
        </button>
    </section>

    <footer>
        <button type="button" id="back-to-tracker-button">
            Back to Tracker
        </button>

        <button type="button" id="switch-to-gps-button">
            Switch to Phone-to-GPS
        </button>
    </footer>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

const personSelect = document.getElementById("person-select");
const dateInput = document.getElementById("tracking-date");
const requestButton = document.getElementById("request-location-button");
const requestStatus = document.getElementById("request-status");
const selectedMessage =
    document.getElementById("selected-person-message");

const locationSection = document.getElementById("location-section");
const locationHeading = document.getElementById("location-heading");
const locationStatus = document.getElementById("location-status");
const coordinates = document.getElementById("coordinates");
const mapsButton = document.getElementById("open-google-maps-button");

// Set calendar to today's local date.
const today = new Date();

dateInput.value = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")
].join("-");

// Map setup.
const initialPosition = [-29.8587, 31.0218];

const map = L.map("live-map").setView(initialPosition, 14);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">' +
        'OpenStreetMap contributors</a>'
}).addTo(map);

let marker = null;
let currentCoordinates = null;

// Update the selected member.
personSelect.addEventListener("change", function () {
    const name =
        personSelect.options[personSelect.selectedIndex].text;

    selectedMessage.textContent = personSelect.value
        ? "Selected: " + name
        : "Select a member to continue.";
});

// Request location and navigate to the map view.
requestButton.addEventListener("click", function () {
    const personId = personSelect.value;
    const selectedDate = dateInput.value;

    if (!personId) {
        requestStatus.textContent =
            "Please select a Safe Circle member.";
        return;
    }

    if (!selectedDate) {
        requestStatus.textContent =
            "Please select a tracking date.";
        return;
    }

    const personName =
        personSelect.options[personSelect.selectedIndex].text;

    requestStatus.textContent =
        "Requesting location for " + personName + "...";

    const params = new URLSearchParams({
        person: personId,
        date: selectedDate
    });

    // Navigate to this page's map view.
    window.location.href =
        "phone-to-phone.html?showMap=true&" + params.toString();
});

// Open Google Maps when coordinates are available.
mapsButton.addEventListener("click", function () {
    if (!currentCoordinates) {
        locationStatus.textContent =
            "No location coordinates are available.";
        return;
    }

    const url =
        "https://www.google.com/maps?q=" +
        currentCoordinates.lat + "," +
        currentCoordinates.lng;

    window.open(url, "_blank", "noopener,noreferrer");
});

// Navigation.
document.getElementById("back-to-tracker-button")
    .addEventListener("click", function () {
        window.location.href = "tracker.html";
    });

document.getElementById("switch-to-gps-button")
    .addEventListener("click", function () {
        window.location.href = "phone-to-gps.html";
    });

// Show the map automatically after navigation.
const params = new URLSearchParams(window.location.search);

if (params.get("showMap") === "true") {
    const personId = params.get("person");
    const selectedDate = params.get("date");

    const option = Array.from(personSelect.options)
        .find(item => item.value === personId);

    if (option) {
        personSelect.value = personId;

        const personName = option.text;

        dateInput.value = selectedDate || dateInput.value;

        selectedMessage.textContent = "Selected: " + personName;
        locationHeading.textContent = personName + "'s Location";

        locationSection.hidden = false;

        // IMPORTANT:
        // This is a sample coordinate. Replace this section with
        // the selected member's actual shared Firebase coordinates.
        const position = {
            lat: -29.8587,
            lng: 31.0218
        };

        currentCoordinates = position;

        marker = L.marker([position.lat, position.lng])
            .addTo(map)
            .bindPopup(personName + "'s map position")
            .openPopup();

        map.setView([position.lat, position.lng], 16);

        coordinates.textContent =
            "Latitude: " + position.lat +
            " | Longitude: " + position.lng;

        locationStatus.textContent =
            "Map loaded. Waiting for the member's actual shared location.";

        mapsButton.disabled = false;

        requestStatus.textContent =
            "Location map opened for " + personName + ".";

        setTimeout(function () {
            map.invalidateSize();
        }, 200);
    }
}
</script>

</body>
</html>
