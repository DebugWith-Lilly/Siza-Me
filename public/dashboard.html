<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siza-Me Dashboard</title>

    <style>
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .block {
            border: 1px solid black;
            border-radius: 12px;
            padding: 16px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: black;
            box-sizing: border-box;
        }

        .wide-block {
            margin-top: 12px;
            min-height: 80px;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid black;
            border-radius: 12px;
            padding: 12px 4px;
            margin-top: 20px;
            gap: 4px;
        }

        .bottom-nav a {
            text-decoration: none;
            color: black;
            text-align: center;
            flex: 1;
        }

        .sos-button {
            border: 1px solid black;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .circle {
            border: 1px solid black;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="profile">
            <div class="circle">PFP</div>
            <h3>Good morning, Alex</h3>
        </div>
        <div class="circle">BELL</div>
    </header>

    <section class="block wide-block">
        <h3>You are safe</h3>
        <span>&gt;</span>
    </section>

    <main>
        <div class="feature-grid">

            <a href="emergency.html" class="block">
                <h3>Emergency</h3>
                <span>&gt;</span>
            </a>

            <a href="live-location.html" class="block">
                <h3>Live Location</h3>
                <span>&gt;</span>
            </a>

            <a href="track.html" class="block">
                <h3>Track</h3>
                <span>&gt;</span>
            </a>

            <a href="my-diary.html" class="block">
                <h3>My Diary</h3>
                <span>&gt;</span>
            </a>

            <a href="services.html" class="block">
                <h3>Services</h3>
                <span>&gt;</span>
            </a>

            <a href="vault.html" class="block">
                <h3>Vault</h3>
                <span>&gt;</span>
            </a>

        </div>

        <a href="my-diary.html" class="block wide-block">
            <h3>Documentation &amp; Diary</h3>
            <span>&gt;</span>
        </a>
    </main>

    <nav class="bottom-nav">

        <a href="dashboard.html">
            <div>⌂</div>
            <div>Home</div>
        </a>

        <a href="live-location.html">
            <div>○</div>
            <div>Map</div>
        </a>

        <a href="sos.html">
            <div class="sos-button">SOS</div>
        </a>

        <a href="my-diary.html">
            <div>▤</div>
            <div>Diary</div>
        </a>

        <a href="services.html">
            <div>▦</div>
            <div>Services</div>
        </a>

    </nav>

</body>
</html>
