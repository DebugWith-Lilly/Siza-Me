<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Universal character set encoding -->
  <meta charset="UTF-8">

  <!-- Responsive viewport configuration for mobile and laptop screen alignment -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Browser tab title -->
  <title>SizaMe - Welcome</title>

  <!-- Google Font import: Inter & Poppins for clean modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       GLOBAL RESET & BASE LAYOUT STYLES
       ========================================================================== */

    /* Universal box-sizing reset to ensure padding doesn't affect dimensions */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Outer body container setting full page background and layout */
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f6efe6; /* Exact warm cream background color applied to the entire page */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       MAIN CARD / FULL-SCREEN RESPONSIVE CONTAINER STYLES
       ========================================================================== */

    /* Main responsive screen display container filling the viewport */
    .welcome-card {
      position: relative;
      width: 100%;
      min-height: 100vh; /* Full viewport height for laptop and mobile responsiveness */
      background-color: #f6efe6; /* Exact warm cream background color from design image */
      overflow: hidden;   /* Keeps top and bottom artwork clipped cleanly inside viewport edges */
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centered content vertically */
      align-items: center;
      padding: 40px 20px; /* Responsive padding */
    }

    /* ==========================================================================
       MAIN CONTENT SECTION & TYPOGRAPHY
       ========================================================================== */

    /* Center column container aligning logo, titles, and button */
    .content-wrapper {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 500px; /* Limits max width on large laptop screens for optimal readability */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 28px;
    }

    /* Logo PNG container dimensions */
    .logo-container {
      width: 110px;
      height: 110px;
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Logo image scaling and layout styling */
    .sizame-logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Preserves aspect ratio without distortion */
    }

    /* Main brand title "SizaMe" */
    .brand-title {
      font-size: clamp(2.8rem, 5vw, 3.8rem); /* Responsive font scaling for mobile and laptops */
      font-weight: 700;
      color: #2b422a; /* Exact deep forest green tone from design logo */
      letter-spacing: -0.8px;
      line-height: 1.05;
      margin-bottom: 10px;
    }

    /* Primary tagline text under brand title */
    .brand-tagline {
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 600;
      color: #262626;
      letter-spacing: -0.1px;
      margin-bottom: 40px; /* Balanced spacing for center vertical alignment */
    }

    /* Secondary subtext paragraph */
    .brand-subtext {
      font-size: clamp(0.85rem, 1.8vw, 0.95rem);
      line-height: 1.6;
      font-weight: 500;
      color: #333333;
      margin-bottom: 40px; /* Balanced spacing for center vertical alignment */
    }

    /* ==========================================================================
       ACTION BUTTON STYLES (GET STARTED BUTTON)
       ========================================================================== */

    /* Outer wrapper constraining action button width */
    .action-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Primary "Get Started" Action Button */
    .btn-get-started {
      /* Flexbox alignment for button text and arrow icon */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px; /* Spacing between "Get Started" text and right arrow */

      /* Width and internal button padding */
      width: 100%;
      max-width: 220px;
      padding: 13px 20px;

      /* Fully rounded pill capsule shape matching image */
      border-radius: 50px;

      /* Exact dark olive green background color from design image */
      background-color: #364935;
      color: #ffffff; /* Clean white text color */

      /* Button text typography settings */
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none; /* Removes anchor underline */

      /* Interactive animations and state transitions */
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
      cursor: pointer;
      border: none;
      outline: none;

      /* Soft grounding shadow under button */
      box-shadow: 0 4px 14px rgba(54, 73, 53, 0.25);
    }

    /* Hover State for Get Started Button */
    .btn-get-started:hover {
      background-color: #293828; /* Deepens green shade slightly on hover */
      transform: translateY(-2px); /* Subtle upward lift effect */
      box-shadow: 0 6px 18px rgba(54, 73, 53, 0.35); /* Enhances shadow depth */
    }

    /* Active Press State for Get Started Button */
    .btn-get-started:active {
      transform: translateY(0); /* Returns button position down on click press */
      box-shadow: 0 2px 8px rgba(54, 73, 53, 0.2);
    }

    /* Styling for internal button text label */
    .btn-text {
      letter-spacing: 0.2px;
    }

    /* Right Arrow Icon SVG inside button */
    .btn-arrow {
      transition: transform 0.2s ease;
    }

    /* Arrow forward shift animation on hover */
    .btn-get-started:hover .btn-arrow {
      transform: translateX(4px); /* Moves arrow slightly right on hover */
    }

    /* Focus state for keyboard accessibility */
    .btn-get-started:focus-visible {
      outline: 2px solid #364935;
      outline-offset: 3px;
    }

    /* ==========================================================================
       BACKGROUND ARTWORK & TRADITIONAL PATTERN SVG OVERLAYS
       ========================================================================== */

    /* Top-Left Organic Shape Corner Container */
    .top-left-decor {
      position: absolute;
      top: 0;
      left: 0;
      width: 155px;
      height: 165px;
      z-index: 1;
      pointer-events: none;
    }

    /* Bottom-Left Protea Floral Graphic Container */
    .bottom-left-decor {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 175px;
      height: 250px;
      z-index: 1;
      pointer-events: none;
    }

    /* Bottom-Right Traditional Geometric Pattern Container */
    .bottom-right-decor {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 180px;
      height: 200px;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Main Responsive Screen Display Container -->
  <main class="welcome-card">

    <!-- Top Left Organic Graphic SVG Overlay -->
    <div class="top-left-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 155 165" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Main Terracotta Top Curved Shape -->
        <path d="M0 0 H120 C120 0 100 45 60 55 C20 65 0 120 0 120 V0 Z" fill="#C26638"/>
        <!-- Soft Tan Underlayer Curve -->
        <path d="M0 50 C20 50 40 70 30 110 C20 150 0 165 0 165 V50 Z" fill="#E8B87D" opacity="0.85"/>
        <!-- Abstract White Line Accents inside top shape -->
        <path d="M15 10 L35 40 M30 10 L50 35 M45 10 L65 30 M10 25 L25 50" stroke="#EFE1CE" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Main Central Content Section -->
    <section class="content-wrapper">

      <!-- SizaMe PNG Logo Image Container -->
      <div class="logo-container">
        <img src="logo.png" alt="SizaMe Logo" class="sizame-logo-img">
      </div>

      <!-- App Name Header -->
      <h1 class="brand-title">SizaMe</h1>

      <!-- Primary Tagline -->
      <p class="brand-tagline">My community. My Safety. My Voice.</p>

      <!-- Secondary Mission Paragraph -->
      <p class="brand-subtext">
        One app. Safer communities.<br>
        Stronger support. A safer you.
      </p>

      <!-- Action Button Area -->
      <div class="action-container">
        <!-- Get Started Link Button -->
        <a href="login.html" class="btn-get-started" id="getStartedBtn" role="button">
          <!-- Button Text -->
          <span class="btn-text">Get Started</span>
          <!-- Button Right Arrow Icon SVG -->
          <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

    </section>

    <!-- Bottom Left Protea Botanical Illustration SVG Overlay -->
    <div class="bottom-left-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 175 250" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Leaf 1 (Dark Green) -->
        <path d="M-10 120 C30 110 70 150 50 210 C10 210 -10 170 -10 120 Z" fill="#2E402D"/>
        <!-- Background Leaf 2 (Olive Green) -->
        <path d="M30 180 C80 160 110 200 80 250 C40 250 20 220 30 180 Z" fill="#4B5C40"/>
        <!-- Soft Tan Curve Background -->
        <path d="M-20 200 C30 190 80 220 70 270 H-20 V200 Z" fill="#E8B87D" opacity="0.8"/>
        
        <!-- Protea Flower Petals Base -->
        <g transform="translate(10, 140)">
          <path d="M35 50 C15 30 10 0 35 -10 C45 10 45 30 35 50 Z" fill="#C26638"/>
          <path d="M35 50 C25 25 30 -5 48 -15 C55 10 50 30 35 50 Z" fill="#D87846"/>
          <path d="M35 50 C35 20 50 -10 65 -12 C68 15 58 35 35 50 Z" fill="#C26638"/>
          <path d="M35 50 C45 25 65 0 80 5 C78 25 60 40 35 50 Z" fill="#D6A35C"/>
          <path d="M35 50 C5 35 -5 10 15 0 C25 20 30 38 35 50 Z" fill="#B85834"/>
          <!-- Protea Stem -->
          <path d="M35 50 L10 110" stroke="#2E402D" stroke-width="7" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- Bottom Right Traditional Geometric Pattern SVG Overlay -->
    <div class="bottom-right-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 180 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Curved Arch (Terracotta Orange) -->
        <path d="M180 40 C110 40 40 100 20 200 H180 V40 Z" fill="#C26638"/>
        
        <!-- Traditional Chevron / Triangular Geometric Pattern Mask -->
        <g opacity="0.9">
          <!-- Chevron Stripe 1 (Cream White) -->
          <path d="M180 80 L120 140 L180 200" stroke="#F6EFE6" stroke-width="12" stroke-linecap="square" fill="none"/>
          <!-- Chevron Stripe 2 (Teal / Dark Olive) -->
          <path d="M180 105 L140 145 L180 185" stroke="#364935" stroke-width="10" stroke-linecap="square" fill="none"/>
          <!-- Chevron Stripe 3 (Tan Gold) -->
          <path d="M180 125 L155 150 L180 175" stroke="#D6A35C" stroke-width="8" stroke-linecap="square" fill="none"/>
          
          <!-- Additional Pattern Lines in Corner -->
          <line x1="80" y1="200" x2="180" y2="100" stroke="#364935" stroke-width="6"/>
          <line x1="110" y1="200" x2="180" y2="130" stroke="#F6EFE6" stroke-width="6"/>
          <line x1="140" y1="200" x2="180" y2="160" stroke="#D6A35C" stroke-width="6"/>
        </g>
      </svg>
    </div>

  </main>

  <!-- Embedded JavaScript -->
  <script>
    // Embedded script executed once DOM elements are fully loaded
    document.addEventListener('DOMContentLoaded', () => {
      // Select Get Started button element by ID
      const getStartedBtn = document.getElementById('getStartedBtn');

      if (getStartedBtn) {
        // Add click listener for navigation or logging
        getStartedBtn.addEventListener('click', (event) => {
          console.log('Get Started button clicked. Navigating to login screen...');
        });
      }
    });
  </script>
</body>
</html>
